aid: submittable
url: https://raw.githubusercontent.com/api-evangelist/submittable/refs/heads/main/apis.yml
name: Submittable
kind: company
description: Submittable is a submission management, grants, and applications
  platform used by foundations, nonprofits, corporations, and governments to
  collect, review, and manage forms, applications, submissions, and awards. Its
  public REST API (v4, base https://submittable-api.submittable.com) provides
  read-and-write, programmatic access to account data - submissions and their
  form-field entries, projects and forms, submitters (users), labels, review
  team members and assignments, funds and payment distributions, and message
  attachments. The API uses HTTP Basic Authentication (an account access token
  sent as the password) and is throttled at roughly 10 transactions per second
  and 10,000 transactions per hour. API access is enabled per account under
  More > Integrations > API Access, and Submittable pricing is quote-based
  (bundled Grant/Application Management and Corporate Social Responsibility
  products, plus Enterprise) via contact-sales.
