providerId: submittable
created: '2026-07-05'
modified: '2026-07-05'
reconciled: false
tags:
- Submission Management
- Grants Management
- Applications
- Plans
- Enterprise
description: >-
  Submittable does not publish per-seat, self-serve list prices on its public
  pricing page. Pricing is quote-based and organized around bundleable products
  - Grant and Application Management and a Corporate Social Responsibility (CSR)
  platform - plus an Enterprise offering with enhanced features, support, and
  services. Buyers select individual products or bundle them, then engage Sales
  ("Book a Meeting" / "Talk to Sales") for a quote. Third-party sources have
  historically cited annual plans in the low-thousands-of-dollars-per-month
  range scaling by user count with a custom Enterprise tier, but Submittable
  does not confirm fixed figures publicly, so no numeric list price is asserted
  here. API access is not sold as a separate metered product; it is enabled per
  account under More > Integrations > API Access and governed by the platform's
  transaction rate limits rather than usage-based API billing.
notes: >-
  Verify current products, bundles, and any tier that gates API access directly
  with Submittable Sales during reconciliation. Figures circulated by
  third-party review sites are unconfirmed and intentionally not encoded as
  plan prices.
sources:
- https://www.submittable.com/pricing/
- https://www.submittable.com/
- https://submittable.help/en/articles/905022-does-submittable-have-an-api
