principles:
- name: Visibility
  description: Track the contracted subscription amount, seat count, and which products (Grants/Applications, CSR, Enterprise) are bundled; separate software cost from program grant disbursements.
- name: Allocation
  description: Map seats and projects to internal teams/programs so the subscription maps to cost centers; tag disbursed funds to the correct grant program budget.
- name: Optimization
  description: Right-size seat counts and bundles at renewal; use the API within rate limits to automate data exports and reviewer workflows instead of paying for manual effort.
- name: Accountability
  description: Assign an owner for the Submittable contract and review renewal, seat utilization, and program spend on a regular cadence.
