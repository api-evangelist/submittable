description: >-
  FinOps view of Submittable spend. Submittable is sold as a quote-based SaaS
  subscription (Grant and Application Management and/or Corporate Social
  Responsibility products, plus Enterprise), not as usage-metered API billing.
  The dominant cost is the annual platform subscription negotiated with Sales,
  typically scaling with the number of users/seats and the products bundled,
  with implementation/onboarding as a one-time charge for larger deployments.
  The API itself carries no separate per-call fee; its consumption is bounded by
  rate limits (10 transactions/second, 10,000/hour) rather than a metered
  invoice line. For grantmaking customers, disbursed award/grant funds flow
  through the platform but are program spend rather than Submittable software
  cost.
notes: >-
  No public per-unit API price exists to reconcile. Treat Submittable as a fixed
  annual subscription (plus optional implementation) for budgeting; confirm the
  contracted amount, seat count, and bundle with Submittable Sales.
