meters:
- name: subscription
  description: Annual platform subscription, quote-based and typically scaled by seats and bundled products.
  unit: contract
  aggregation: sum
  dimensions:
  - account
  - product
- name: seats
  description: Number of users/team members licensed on the account.
  unit: users
  aggregation: max
  dimensions:
  - account
- name: implementation
  description: One-time implementation/onboarding charge for larger deployments.
  unit: contract
  aggregation: sum
  dimensions:
  - account
- name: api_transactions
  description: API transactions consumed; not separately billed but bounded by rate limits (10/sec, 10,000/hour).
  unit: transactions
  aggregation: sum
  dimensions:
